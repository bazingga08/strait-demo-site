<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fingerprint check · browser side</title>
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem('strait.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="strait-tokens.css">
<link rel="stylesheet" href="strait-ui.css">
<link rel="stylesheet" href="strait-parts.css">
<link rel="stylesheet" href="assets/demo.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--st-bg-subtle); padding: var(--st-space-4); box-sizing: border-box; }
  main { width: 100%; max-width: 26rem; text-align: center; display: flex; flex-direction: column;
         align-items: center; gap: var(--st-space-4); padding: var(--st-space-8) var(--st-space-6); }
  .logo img { display: block; height: 32px; width: auto; }
  main p { margin: 0; color: var(--st-text-muted); font: var(--st-text-body-lg); }
  #code { display: block; font: 600 26px/1.2 var(--st-font-mono); letter-spacing: .02em; color: var(--st-text);
          background: var(--st-brand-subtle); border: 1px solid var(--st-brand-border); border-radius: var(--st-radius-lg);
          padding: var(--st-space-3) var(--st-space-4); word-break: break-all; max-width: 100%; }
  #code:empty { display: none; }
</style>
</head>
<body class="st-root">
<main class="st-card">
  <span class="logo"><img class="lk-l" src="assets/strait-lockup.svg" alt="Strait" width="97" height="32"><img class="lk-d" src="assets/strait-lockup-dark.svg" alt="Strait" width="97" height="32"></span>
  <h1 class="st-h1">Fingerprint check</h1>
  <p id="msg">Reading this browser…</p>
  <code id="code"></code>
  <p id="next" hidden>Done. Go back to the Strait Link app: it compares its own fingerprint with this one.</p>
</main>
<script>
// Hosted here (not on the link domain) so Android doesn't hand the page to the
// app that claims the link domain. Calls the engine cross-origin (CORS *).
(async () => {
  const q = new URLSearchParams(location.search);
  const key = q.get('k') || '';
  const engine = (q.get('e') || 'https://strait.link').replace(/\/+$/, '');
  const msg = document.getElementById('msg');
  if (!/^st_pub_(live|test)_[A-Za-z0-9]{6,64}$/.test(key)) { msg.textContent = 'Open this page from the Strait Link app (it adds your key).'; return; }
  if (!/^https:\/\//.test(engine)) { msg.textContent = 'Invalid engine address.'; return; }
  try {
    const r = await fetch(engine + '/v1/debug/fingerprint', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        publishableKey: key, origin: 'web',
        screenWidth: Math.round(screen.width), pixelRatio: window.devicePixelRatio || 1,
        language: navigator.language || 'en',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'XX',
      }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    msg.textContent = "This browser's fingerprint:";
    document.getElementById('code').textContent = j.extHash;
    document.getElementById('next').hidden = false;
  } catch (e) { msg.textContent = 'Could not read the fingerprint: ' + e.message; }
})();
</script>
</body>
</html>
