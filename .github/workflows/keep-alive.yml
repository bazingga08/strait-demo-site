# Manual deep health check of Strait (engine + database): Actions > keep-strait-awake > Run.
# The */10 schedule is retired (11 Oct 2026): GitHub ran it only every 3.5-7 hours, so it
# neither kept Render/Supabase awake nor alerted in time. Keep-warm and outage alerts now
# come from the strait-edge Worker cron (every 5 min, /healthz/deep, Telegram on 2 fails):
# strait-redirect-engine edge/README.md "Outage alerts" and "Keep-warm".
# To bring the schedule back: add `schedule: [{cron: '*/10 * * * *'}]` under `on:`.
name: keep-strait-awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deep health check (engine + database)
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl -s -o body.json -w '%{http_code}' -m 90 https://strait.link/healthz/deep || true)
            echo "attempt $attempt: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Strait engine or database is down (last HTTP $code)"
          exit 1
