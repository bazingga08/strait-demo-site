<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tap a link in the browser</title>
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem('strait.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="strait-tokens.css">
<link rel="stylesheet" href="strait-ui.css">
<link rel="stylesheet" href="strait-parts.css">
<link rel="stylesheet" href="assets/demo.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--st-bg-subtle); padding: var(--st-space-4); box-sizing: border-box; }
  main { width: 100%; max-width: 26rem; text-align: center; display: flex; flex-direction: column;
         align-items: center; gap: var(--st-space-4); padding: var(--st-space-8) var(--st-space-6); }
  .logo img { display: block; height: 32px; width: auto; }
  main p { margin: 0; color: var(--st-text-muted); font: var(--st-text-body-lg); }
  #go { min-width: 220px; height: var(--st-control-lg); font-size: var(--st-size-17); font-weight: 600; } /* control-lg, size ladder (DS v5 §4, §5) */
  #url { font: var(--st-text-code); word-break: break-all; color: var(--st-text-muted); background: none; padding: 0; }
</style>
</head>
<body class="st-root">
<main class="st-card">
  <span class="logo"><img class="lk-l" src="assets/strait-lockup.svg" alt="Strait" width="97" height="32"><img class="lk-d" src="assets/strait-lockup-dark.svg" alt="Strait" width="97" height="32"></span>
  <h1 class="st-h1">Tap the link</h1>
  <p>This is a normal web page in your browser, like a site or an email that contains a Strait link.</p>
  <a class="btn st-btn st-btn--primary st-btn--lg" id="go" href="#">Open the link</a>
  <p><code id="url"></code></p>
</main>
<script>
// Only Strait short links (https) are allowed as targets.
const u = new URLSearchParams(location.search).get('u') || '';
const ok = /^https:\/\/[^\s"<>]+$/.test(u);
document.getElementById('go').href = ok ? u : '#';
document.getElementById('url').textContent = ok ? u : 'Open this page from the Strait Link app.';
</script>
</body>
</html>
